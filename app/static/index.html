<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINE 群組關鍵字助手 - 後台管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    .line-green { background-color: #06C755; }
    .line-green-hover:hover { background-color: #05b04a; }
    .line-text { color: #06C755; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- 頂部通知 Toast -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- 登入畫面 -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-md p-8">
      <div class="flex items-center justify-center mb-6">
        <div class="w-14 h-14 rounded-2xl line-green flex items-center justify-center text-white text-2xl shadow-md">
          <i class="fa-brands fa-line text-3xl"></i>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-center text-slate-800 mb-1">LINE 群組關鍵字助手</h1>
      <p class="text-sm text-center text-slate-500 mb-6">管理員後台登入 (Admin Panel)</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">管理員帳號</label>
          <input id="login-username" type="text" required placeholder="請輸入 ADMIN_USERNAME"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">管理員密碼</label>
          <input id="login-password" type="password" required placeholder="請輸入 ADMIN_PASSWORD"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition" />
        </div>
        <button type="submit"
          class="w-full py-3 rounded-xl line-green line-green-hover text-white font-semibold shadow-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>登入系統</span>
        </button>
      </form>
    </div>
  </div>

  <!-- 主管理介面 -->
  <div id="admin-view" class="hidden min-h-screen flex flex-col">
    <!-- 導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl line-green flex items-center justify-center text-white">
            <i class="fa-brands fa-line text-2xl"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-800 leading-tight">LINE 群組關鍵字助手</h1>
            <p class="text-xs text-slate-500">FastAPI + PostgreSQL + Cloudinary 雲端管理後台</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a href="/docs" target="_blank"
            class="text-xs sm:text-sm text-slate-600 hover:text-emerald-600 px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-300 transition flex items-center gap-1.5">
            <i class="fa-solid fa-code"></i>
            <span>API 文件 (Swagger)</span>
          </a>
          <span id="admin-badge" class="hidden sm:inline-flex items-center gap-1.5 text-sm text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg">
            <i class="fa-solid fa-user-shield text-emerald-600"></i>
            <span id="current-username">admin</span>
          </span>
          <button onclick="logout()"
            class="text-sm text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-200 transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>登出</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 內容區 -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 space-y-6">

      <!-- 統計卡片 -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <div class="text-xs font-medium text-slate-500">總關鍵字規則</div>
          <div id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <div class="text-xs font-medium text-emerald-600">啟用中規則</div>
          <div id="stat-active" class="text-2xl font-bold text-emerald-600 mt-1">0</div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <div class="text-xs font-medium text-blue-600">完全比對 / 包含比對</div>
          <div id="stat-match" class="text-2xl font-bold text-blue-600 mt-1">0 / 0</div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <div class="text-xs font-medium text-purple-600">圖片 / PDF 媒體規則</div>
          <div id="stat-media" class="text-2xl font-bold text-purple-600 mt-1">0</div>
        </div>
      </div>

      <!-- 工具列：搜尋、篩選、新增、CSV 匯入/匯出 -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col lg:flex-row gap-4 justify-between items-stretch lg:items-center">
        <div class="flex flex-col sm:flex-row gap-3 flex-1">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input id="filter-search" type="text" placeholder="搜尋關鍵字或回覆內容..."
              oninput="loadKeywords()"
              class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <select id="filter-match" onchange="loadKeywords()"
            class="px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="">所有比對模式</option>
            <option value="exact">完全比對 (exact)</option>
            <option value="contains">包含比對 (contains)</option>
          </select>
          <select id="filter-reply" onchange="loadKeywords()"
            class="px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="">所有回覆格式</option>
            <option value="text">純文字 (text)</option>
            <option value="image">圖片 (image)</option>
            <option value="pdf">PDF 連結 (pdf)</option>
          </select>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button onclick="downloadCsvTemplate()"
            class="px-3.5 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 text-sm font-medium transition flex items-center gap-1.5">
            <i class="fa-solid fa-file-csv text-slate-500"></i>
            <span>下載範本</span>
          </button>
          <button onclick="exportCsv()"
            class="px-3.5 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 text-sm font-medium transition flex items-center gap-1.5">
            <i class="fa-solid fa-download text-emerald-600"></i>
            <span>匯出 CSV</span>
          </button>
          <label class="cursor-pointer px-3.5 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 text-sm font-medium transition flex items-center gap-1.5">
            <i class="fa-solid fa-upload text-blue-600"></i>
            <span>匯入 CSV</span>
            <input id="csv-file-input" type="file" accept=".csv" class="hidden" onchange="importCsv(event)" />
          </label>
          <button onclick="openKeywordModal()"
            class="px-4 py-2 rounded-xl line-green line-green-hover text-white text-sm font-semibold shadow-sm transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i>
            <span>新增關鍵字</span>
          </button>
        </div>
      </div>

      <!-- CSV 匯入結果提示區 -->
      <div id="csv-result-box" class="hidden bg-white p-4 rounded-2xl border border-amber-300 shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-circle-info text-amber-500"></i>
            <span id="csv-result-summary">CSV 匯入結果</span>
          </h3>
          <button onclick="document.getElementById('csv-result-box').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <ul id="csv-error-list" class="text-xs text-rose-600 space-y-1 max-h-40 overflow-y-auto list-disc pl-5"></ul>
      </div>

      <!-- 關鍵字資料表 -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                <th class="py-3.5 px-4">狀態</th>
                <th class="py-3.5 px-4">關鍵字</th>
                <th class="py-3.5 px-4">比對模式</th>
                <th class="py-3.5 px-4">回覆類型</th>
                <th class="py-3.5 px-4">回覆內容 / Cloudinary URL</th>
                <th class="py-3.5 px-4">最後更新</th>
                <th class="py-3.5 px-4 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="keywords-tbody" class="divide-y divide-slate-100 text-sm">
              <tr>
                <td colspan="7" class="py-10 text-center text-slate-400">載入中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- 新增 / 編輯關鍵字 Modal -->
  <div id="keyword-modal" class="hidden fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 id="modal-title" class="text-lg font-bold text-slate-800">新增關鍵字規則</h2>
        <button onclick="closeKeywordModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="keyword-form" class="p-6 space-y-4">
        <input type="hidden" id="form-keyword-id" />

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">觸發關鍵字 <span class="text-rose-500">*</span></label>
          <input id="form-keyword" type="text" required maxlength="255" placeholder="例如：菜單、營業時間、價目表"
            class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">比對模式</label>
            <select id="form-match-type"
              class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="exact">完全比對 (exact)</option>
              <option value="contains">包含比對 (contains)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">回覆格式類型</label>
            <select id="form-reply-type" onchange="handleReplyTypeChange()"
              class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="text">純文字 (text)</option>
              <option value="image">圖片訊息 (image)</option>
              <option value="pdf">PDF 檔案連結 (pdf)</option>
            </select>
          </div>
        </div>

        <!-- Cloudinary 檔案上傳區（當選擇 image 或 pdf 時顯示） -->
        <div id="cloudinary-upload-box" class="hidden p-4 rounded-xl bg-slate-50 border border-dashed border-slate-300 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-700 flex items-center gap-1.5">
              <i class="fa-solid fa-cloud-arrow-up text-blue-600"></i>
              <span>上傳檔案至 Cloudinary（自動填入下方網址）</span>
            </span>
            <span id="upload-status" class="text-xs text-emerald-600 font-medium"></span>
          </div>
          <input id="media-file-input" type="file" accept="image/*,.pdf" onchange="uploadMediaFile(event)"
            class="block w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
        </div>

        <div>
          <label id="reply-content-label" class="block text-sm font-medium text-slate-700 mb-1">回覆內容 <span class="text-rose-500">*</span></label>
          <textarea id="form-reply-content" rows="4" required placeholder="請輸入要自動回覆的文字，或貼上/上傳 Cloudinary 圖片與 PDF 網址"
            class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        </div>

        <div class="flex items-center gap-2">
          <input id="form-is-active" type="checkbox" checked class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500" />
          <label for="form-is-active" class="text-sm text-slate-700">立即啟用此關鍵字規則</label>
        </div>

        <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
          <button type="button" onclick="closeKeywordModal()"
            class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 text-sm font-medium">
            取消
          </button>
          <button type="submit" id="modal-submit-btn"
            class="px-5 py-2 rounded-xl line-green line-green-hover text-white text-sm font-semibold shadow-sm">
            儲存規則
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "line_keyword_bot_token";
    let allKeywordsCache = [];

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const el = document.createElement("div");
      const bg = type === "error" ? "bg-rose-600" : "bg-slate-800";
      el.className = `${bg} text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 transition-all`;
      el.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check text-emerald-400'}"></i><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    async function apiFetch(url, options = {}) {
      const token = getToken();
      const headers = options.headers ? { ...options.headers } : {};
      if (token) {
        headers["Authorization"] = `Bearer ${token}`;
      }
      const response = await fetch(url, { ...options, headers });
      if (response.status === 401) {
        logout(false);
        throw new Error("登入已過期或未授權，請重新登入");
      }
      return response;
    }

    // 登入處理
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.detail || "登入失敗", "error");
          return;
        }
        localStorage.setItem(TOKEN_KEY, data.access_token);
        document.getElementById("current-username").textContent = data.username;
        showAdminView();
        showToast("登入成功！");
      } catch (err) {
        showToast(err.message || "網路連線錯誤", "error");
      }
    });

    function logout(notify = true) {
      localStorage.removeItem(TOKEN_KEY);
      document.getElementById("admin-view").classList.add("hidden");
      document.getElementById("login-view").classList.remove("hidden");
      if (notify) showToast("已登出系統");
    }

    async function showAdminView() {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("admin-view").classList.remove("hidden");
      await loadKeywords();
    }

    async function checkInitialAuth() {
      const token = getToken();
      if (!token) return;
      try {
        const res = await apiFetch("/api/auth/me");
        if (res.ok) {
          const data = await res.json();
          document.getElementById("current-username").textContent = data.username;
          showAdminView();
        }
      } catch (_) {}
    }

    async function loadKeywords() {
      const search = document.getElementById("filter-search").value.trim();
      const matchType = document.getElementById("filter-match").value;
      const replyType = document.getElementById("filter-reply").value;

      const params = new URLSearchParams();
      if (search) params.set("search", search);
      if (matchType) params.set("match_type", matchType);
      if (replyType) params.set("reply_type", replyType);

      try {
        const res = await apiFetch(`/api/keywords?${params.toString()}`);
        const rules = await res.json();
        allKeywordsCache = rules;
        renderKeywordsTable(rules);
        updateStats(rules);
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    function updateStats(rules) {
      const total = rules.length;
      const active = rules.filter(r => r.is_active).length;
      const exactCount = rules.filter(r => r.match_type === "exact").length;
      const containsCount = rules.filter(r => r.match_type === "contains").length;
      const mediaCount = rules.filter(r => r.reply_type === "image" || r.reply_type === "pdf").length;

      document.getElementById("stat-total").textContent = total;
      document.getElementById("stat-active").textContent = active;
      document.getElementById("stat-match").textContent = `${exactCount} / ${containsCount}`;
      document.getElementById("stat-media").textContent = mediaCount;
    }

    function renderKeywordsTable(rules) {
      const tbody = document.getElementById("keywords-tbody");
      if (!rules.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-12 text-center text-slate-400">目前尚無符合條件的關鍵字規則，請點擊右上角「新增關鍵字」或「匯入 CSV」</td></tr>`;
        return;
      }

      tbody.innerHTML = rules.map(rule => {
        const matchBadge = rule.match_type === "exact"
          ? `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200">完全比對</span>`
          : `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">包含比對</span>`;

        let replyBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700">純文字</span>`;
        if (rule.reply_type === "image") {
          replyBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-purple-50 text-purple-700 border border-purple-200"><i class="fa-regular fa-image mr-1"></i>圖片</span>`;
        } else if (rule.reply_type === "pdf") {
          replyBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200"><i class="fa-regular fa-file-pdf mr-1"></i>PDF</span>`;
        }

        let contentHtml = `<div class="max-w-md truncate text-slate-600" title="${escapeHtml(rule.reply_content)}">${escapeHtml(rule.reply_content)}</div>`;
        if (rule.reply_type === "image" || rule.reply_type === "pdf") {
          contentHtml = `<a href="${escapeHtml(rule.reply_content)}" target="_blank" rel="noopener" class="text-blue-600 hover:underline flex items-center gap-1 max-w-md truncate">
            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            <span class="truncate">${escapeHtml(rule.reply_content)}</span>
          </a>`;
        }

        const updatedDate = new Date(rule.updated_at).toLocaleString("zh-TW", { hour12: false });

        return `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="py-3.5 px-4">
              <button onclick="toggleStatus(${rule.id})" title="點擊切換啟用/停用"
                class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold transition ${
                  rule.is_active
                    ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100'
                    : 'bg-slate-100 text-slate-500 border border-slate-200 hover:bg-slate-200'
                }">
                <span class="w-2 h-2 rounded-full ${rule.is_active ? 'bg-emerald-500' : 'bg-slate-400'}"></span>
                <span>${rule.is_active ? '啟用中' : '已停用'}</span>
              </button>
            </td>
            <td class="py-3.5 px-4 font-bold text-slate-800">${escapeHtml(rule.keyword)}</td>
            <td class="py-3.5 px-4">${matchBadge}</td>
            <td class="py-3.5 px-4">${replyBadge}</td>
            <td class="py-3.5 px-4">${contentHtml}</td>
            <td class="py-3.5 px-4 text-xs text-slate-400 whitespace-nowrap">${updatedDate}</td>
            <td class="py-3.5 px-4 text-right whitespace-nowrap space-x-1">
              <button onclick="openEditModal(${rule.id})"
                class="p-2 rounded-lg text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition" title="編輯">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="deleteRule(${rule.id}, '${escapeHtml(rule.keyword)}')"
                class="p-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50 transition" title="刪除">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function handleReplyTypeChange() {
      const replyType = document.getElementById("form-reply-type").value;
      const uploadBox = document.getElementById("cloudinary-upload-box");
      const label = document.getElementById("reply-content-label");
      if (replyType === "image" || replyType === "pdf") {
        uploadBox.classList.remove("hidden");
        label.innerHTML = `${replyType === "image" ? "圖片" : "PDF"} Cloudinary URL <span class="text-rose-500">*</span>`;
      } else {
        uploadBox.classList.add("hidden");
        label.innerHTML = `回覆文字內容 <span class="text-rose-500">*</span>`;
      }
    }

    function openKeywordModal() {
      document.getElementById("modal-title").textContent = "新增關鍵字規則";
      document.getElementById("form-keyword-id").value = "";
      document.getElementById("form-keyword").value = "";
      document.getElementById("form-match-type").value = "exact";
      document.getElementById("form-reply-type").value = "text";
      document.getElementById("form-reply-content").value = "";
      document.getElementById("form-is-active").checked = true;
      document.getElementById("upload-status").textContent = "";
      document.getElementById("media-file-input").value = "";
      handleReplyTypeChange();
      document.getElementById("keyword-modal").classList.remove("hidden");
    }

    function openEditModal(id) {
      const rule = allKeywordsCache.find(r => r.id === id);
      if (!rule) return;
      document.getElementById("modal-title").textContent = `編輯關鍵字：${rule.keyword}`;
      document.getElementById("form-keyword-id").value = rule.id;
      document.getElementById("form-keyword").value = rule.keyword;
      document.getElementById("form-match-type").value = rule.match_type;
      document.getElementById("form-reply-type").value = rule.reply_type;
      document.getElementById("form-reply-content").value = rule.reply_content;
      document.getElementById("form-is-active").checked = rule.is_active;
      document.getElementById("upload-status").textContent = "";
      document.getElementById("media-file-input").value = "";
      handleReplyTypeChange();
      document.getElementById("keyword-modal").classList.remove("hidden");
    }

    function closeKeywordModal() {
      document.getElementById("keyword-modal").classList.add("hidden");
    }

    // 上傳圖片或 PDF 到 Cloudinary
    async function uploadMediaFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById("upload-status");
      statusEl.textContent = "正在上傳至 Cloudinary...";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await apiFetch("/api/upload", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = "";
          showToast(data.detail || "上傳失敗", "error");
          return;
        }
        document.getElementById("form-reply-content").value = data.url;
        if (data.resource_type === "pdf") {
          document.getElementById("form-reply-type").value = "pdf";
        } else {
          document.getElementById("form-reply-type").value = "image";
        }
        statusEl.textContent = "✓ 上傳成功，已自動帶入網址";
        showToast("媒體檔案已上傳至 Cloudinary！");
      } catch (err) {
        statusEl.textContent = "";
        showToast(err.message || "上傳發生錯誤", "error");
      }
    }

    // 儲存（新增或更新）關鍵字
    document.getElementById("keyword-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("form-keyword-id").value;
      const payload = {
        keyword: document.getElementById("form-keyword").value.trim(),
        match_type: document.getElementById("form-match-type").value,
        reply_type: document.getElementById("form-reply-type").value,
        reply_content: document.getElementById("form-reply-content").value.trim(),
        is_active: document.getElementById("form-is-active").checked,
      };

      const url = id ? `/api/keywords/${id}` : "/api/keywords";
      const method = id ? "PUT" : "POST";

      try {
        const res = await apiFetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.detail || "儲存失敗", "error");
          return;
        }
        closeKeywordModal();
        await loadKeywords();
        showToast(id ? "關鍵字規則已更新！" : "已新增關鍵字規則！");
      } catch (err) {
        showToast(err.message, "error");
      }
    });

    async function toggleStatus(id) {
      try {
        const res = await apiFetch(`/api/keywords/${id}/toggle`, { method: "PATCH" });
        if (!res.ok) {
          const err = await res.json();
          showToast(err.detail || "切換失敗", "error");
          return;
        }
        await loadKeywords();
        showToast("已切換關鍵字啟用狀態");
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function deleteRule(id, keyword) {
      if (!confirm(`確定要刪除關鍵字「${keyword}」嗎？`)) return;
      try {
        const res = await apiFetch(`/api/keywords/${id}`, { method: "DELETE" });
        if (!res.ok) {
          showToast("刪除失敗", "error");
          return;
        }
        await loadKeywords();
        showToast(`已刪除關鍵字「${keyword}」`);
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function exportCsv() {
      try {
        const res = await apiFetch("/api/keywords/export/csv");
        if (!res.ok) {
          showToast("匯出 CSV 失敗", "error");
          return;
        }
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `keywords_export_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
        showToast("CSV 匯出成功");
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    function downloadCsvTemplate() {
      const sample = "\uFEFFkeyword,match_type,reply_type,reply_content,is_active\n菜單,exact,image,https://res.cloudinary.com/demo/image/upload/sample.jpg,true\n營業時間,contains,text,我們每天營業時間為 10:00 - 21:00！,true\n產品型錄,exact,pdf,https://res.cloudinary.com/demo/image/upload/sample_catalog.pdf,true\n";
      const blob = new Blob([sample], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "keywords_template.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    async function importCsv(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await apiFetch("/api/keywords/import/csv", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.detail || "CSV 匯入失敗", "error");
          return;
        }

        await loadKeywords();
        const box = document.getElementById("csv-result-box");
        const summary = document.getElementById("csv-result-summary");
        const errorList = document.getElementById("csv-error-list");

        summary.textContent = `CSV 匯入完成：新增 ${data.created} 筆、更新 ${data.updated} 筆、略過錯誤 ${data.skipped} 筆`;
        if (data.errors && data.errors.length > 0) {
          box.classList.remove("hidden");
          errorList.innerHTML = data.errors.map(e => `<li>第 ${e.row} 列 (${escapeHtml(e.keyword || '無關鍵字')})：${escapeHtml(e.error)}</li>`).join("");
          showToast(`匯入完成，但有 ${data.errors.length} 列格式錯誤`, "error");
        } else {
          box.classList.add("hidden");
          showToast(`CSV 匯入成功！新增 ${data.created} 筆、更新 ${data.updated} 筆`);
        }
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    checkInitialAuth();
  </script>
</body>
</html>
